<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repo Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1 class="wordmark">repo log<span class="cursor">_</span></h1>
    <input id="search" type="text" placeholder="search name, description, topic..." autocomplete="off" />
  </div>
</header>

<div class="layout">
  <aside class="rail" id="rail">
    <div class="rail-section">
      <h2>sort</h2>
      <select id="sortSelect">
        <option value="updated_desc">recently pushed</option>
        <option value="created_desc">newest</option>
        <option value="created_asc">oldest</option>
        <option value="stars_desc">most stars</option>
        <option value="name_asc">name a&ndash;z</option>
      </select>
    </div>

    <div class="rail-section">
      <h2>group by</h2>
      <select id="groupSelect">
        <option value="none">none</option>
        <option value="language">language</option>
        <option value="topic">primary topic</option>
        <option value="year">year created</option>
      </select>
    </div>

    <div class="rail-section">
      <h2>language</h2>
      <div id="languageFilters" class="chip-list"></div>
    </div>

    <div class="rail-section">
      <h2>topics</h2>
      <div id="topicFilters" class="chip-list"></div>
    </div>

    <div class="rail-section">
      <label class="checkbox-row">
        <input type="checkbox" id="hideArchived" />
        <span>hide archived</span>
      </label>
    </div>

    <div class="rail-section" id="dataMeta"></div>
  </aside>

  <main class="board">
    <div class="board-status" id="status"></div>
    <div class="board-content" id="board"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
